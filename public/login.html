<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autosample | Login</title>
  <link rel="icon" type="image/png" href="./assets/imgs/simbolo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/estilo.css">
  <script src="./js/sessao.js"></script>
</head>

<body>
  <header class="header">
    <div class="container">
      <a class="titulo" href="./index.html">Autosample</a>
      <nav aria-label="Navegação principal">
        <ul class="navbar">
          <li><a href="./index.html">Início</a></li>
          <li><a href="./acervo.html">Acervo</a></li>
          <li><a href="./dashboard/painel.html">Dashboard</a></li>
          <li data-sessao="visitante"><a href="./login.html" aria-current="page">Entrar</a></li>
          <li class="btn-cadastro" data-sessao="visitante"><a href="./cadastro.html">Criar conta</a></li>
          <li data-sessao="usuario" hidden><a href="./perfil.html">Meu Perfil</a></li>
          <li data-sessao="admin" hidden><a href="./admin.html">Admin</a></li>
          <li class="menu-sessao" data-sessao="usuario" hidden>
            <button type="button" onclick="limparSessao()">Sair</button>
          </li>
        </ul>
      </nav>
    </div>
  </header>


    <main class="login">
        <div class="container">
            <div class="card card-login">
                <span class="hero-assinatura">i s2 myLife</span>
                <h1>Olá de volta!</h1>
                <div class="formulario">
                    <div class="campo">
                        <label for="email_input">E-mail</label>
                        <input id="email_input" type="email" autocomplete="username" maxlength="100" placeholder="Login">
                    </div>
                    <div class="campo">
                        <label for="senha_input">Senha</label>
                        <input id="senha_input" type="password" autocomplete="current-password" maxlength="255" placeholder="******">
                    </div>
                    <button class="botao" onclick="entrar()">Entrar</button>
                </div>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif" alt="Carregando">
                </div>

                <div class="card_erro" id="cardErro" role="status">
                  <span id="mensagem_erro"></span>
                </div>
                <div id="div_erros_login" role="status"></div>
            </div>
        </div>
    </main>

  <footer class="footer">
    <div class="container">
      <p>Autosample &copy; 2026 · Feito por Matheus Santos <em>i s2 myLife</em></p>
    </div>
  </footer>

<script>
    atualizarMenu().catch(console.error);

    function entrar() {
        var email = document.getElementById("email_input").value;
        var senha = document.getElementById("senha_input").value;
        var aviso = document.getElementById("cardErro");
        var mensagem = document.getElementById("mensagem_erro");

        if (!email.trim() || !senha) {
            aviso.style.display = "block";
            mensagem.textContent = "Preencha e-mail e senha.";
            return;
        }

        var dados = {
            emailServer: email,
            senhaServer: senha
        };

        aviso.style.display = "none";
        document.getElementById("div_erros_login").style.display = "none";
        aguardar();

        pedirDados("/usuarios/autenticar", "POST", dados)
            .then(function (usuario) {
                guardarSessao(usuario);
                if (usuario.perfil === "admin") {
                    window.location = "./admin.html";
                } else {
                    window.location = "./index.html";
                }
            })
            .catch(function (erro) {
                finalizarAguardar(erro.message);
            });
    }
</script>
</body>

</html>
