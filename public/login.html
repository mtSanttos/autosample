<script>


    function entrar() {
        aguardar();

        var emailHtml = email_input.value;
        var senhaHtml = senha_input.value;

        if (emailHtml == "" || senhaHtml == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Preencha e-mail e senha.)";
            finalizarAguardar();
            return;
        }
        
       /* console.log("FORM LOGIN: ", emailHtml);
        console.log("FORM SENHA: ", senhaHtml);*/

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailHtml,
                senhaServer: senhaHtml
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
             

                resposta.json().then(json => {
                    

                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.PERFIL_USUARIO = json.perfil;

                    
                    setTimeout(function () {
                        if (json.perfil == "admin") {
                            window.location = "./admin.html";
                        } else {
                            window.location = "./index.html";
                        }
                    }, 1000);
                });
            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar("Não consegui falar com o servidor.");
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
