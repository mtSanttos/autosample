<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autosample | Painel do Admin</title>
  <script src="./js/sessao.js"></script>
  <link rel="icon" type="image/png" href="./assets/imgs/simbolo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/estilo.css">
  <link rel="stylesheet" href="./css/painel.css">
  <style>
    body {
      background-color: var(--marrom);
      color: var(--creme);
      font-family: 'Barlow', sans-serif;
      margin: 0;
      padding: 0;
    }

    .admin-header {
      background: linear-gradient(135deg, var(--marrom), var(--ambar));
      border-bottom: 2px solid var(--ambar);
      padding: 20px 0;
    }

    .admin-header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 80%;
      margin: auto;
      gap: 20px;
    }

    .admin-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .admin-nav a {
      color: var(--creme);
      text-decoration: none;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      border: 1px solid rgba(240, 169, 59, 0.4);
      transition: all 0.2s ease;
    }

    .admin-nav a:hover,
    .admin-nav a.ativo {
      background-color: var(--dourado);
      color: var(--marrom);
      border-color: var(--dourado);
    }

    .admin-header h1 {
      font-family: 'Permanent Marker', cursive;
      color: var(--dourado);
      margin: 0;
      font-size: 2rem;
    }

    .admin-header button {
      background-color: var(--ambar);
      color: var(--creme);
      border: 2px solid var(--dourado);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .admin-container {
      width: 80%;
      margin: 40px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 900px) {
      .admin-container {
        grid-template-columns: 1fr;
      }
    }

    .card-admin {
      background-color: var(--creme);
      color: var(--marrom);
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .card-admin h2 {
      font-family: 'Permanent Marker', cursive;
      color: var(--ambar);
      margin-top: 0;
      font-size: 1.5rem;
    }

    .form-grupo {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }

    .form-grupo label {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .form-grupo input,
    .form-grupo textarea,
    .form-grupo select {
      padding: 10px;
      border: 2px solid var(--ambar);
      border-radius: 6px;
      font-size: 1rem;
      background-color: #fff;
      color: var(--marrom);
    }

    .form-grupo textarea {
      resize: vertical;
      height: 90px;
    }

    .btn-cadastrar {
      background-color: var(--ambar);
      color: var(--creme);
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-cadastrar:hover {
      background-color: var(--marrom);
    }
  </style>
</head>

<body onload="validarAdmin()">

  <header class="admin-header">
    <div class="container">
      <h1>Autosample | Admin</h1>
      <nav class="admin-nav">
        <a href="./index.html">🏠 Início</a>
        <a href="./admin.html" class="ativo">⚙️ Cadastro</a>
        <a href="./dashboard/painel.html">📊 Dashboard</a>
        <a href="./acervo.html">🎵 Acervo (Poesias & Músicas)</a>
      </nav>
      <div>
        <span>Bem-vindo, <strong id="nome_admin"></strong></span>
        <button onclick="limparSessao()">Sair</button>
      </div>
    </div>
  </header>

  <main class="admin-container">
    <!-- Formulário de Poesia -->
    <section class="card-admin">
      <h2>Cadastrar Poesia</h2>
      <div class="form-grupo">
        <label for="titulo_poesia">Título da Poesia:</label>
        <input type="text" id="titulo_poesia" placeholder="Ex: Golden Era">
      </div>
      <div class="form-grupo">
        <label for="texto_poesia">Texto / Versos:</label>
        <textarea id="texto_poesia" placeholder="Escreva os versos aqui..."></textarea>
      </div>
      <div class="form-grupo">
        <label for="emocao_poesia">Emoção Principal:</label>
        <select id="emocao_poesia">
          <option value="">Selecione a emoção</option>
          <option value="amor">Amor</option>
          <option value="saudade">Saudade</option>
          <option value="verdade">Verdade</option>
          <option value="tristeza">Tristeza</option>
          <option value="alegria">Alegria</option>
          <option value="realizacao">Realização</option>
          <option value="orgulho">Orgulho</option>
        </select>
      </div>
      <div class="form-grupo">
        <label for="intensidade_poesia">Intensidade (1 a 5):</label>
        <input type="number" id="intensidade_poesia" min="1" max="5" value="3">
      </div>
      <button class="btn-cadastrar" onclick="cadastrarPoesia()">Cadastrar Poesia</button>
    </section>


    <section class="card-admin">
      <h2>Cadastrar Música (Sample)</h2>
      <div class="form-grupo">
        <label for="titulo_musica">Título da Música:</label>
        <input type="text" id="titulo_musica" placeholder="Ex: My Life" required>
      </div>
      <div class="form-grupo">
        <label for="artista_musica">Artista / Produtor:</label>
        <input type="text" id="artista_musica" placeholder="Ex: Roy Ayers">
      </div>
      <div class="form-grupo">
        <label for="link_musica">Link (YouTube / Spotify):</label>
        <input type="text" id="link_musica" placeholder="https://...">
      </div>
      <div class="form-grupo">
        <label for="emocao_musica">Emoção Principal:</label>
        <select id="emocao_musica">
          <option value="">Selecione a emoção</option>
          <option value="amor">Amor</option>
          <option value="saudade">Saudade</option>
          <option value="verdade">Verdade</option>
          <option value="tristeza">Tristeza</option>
          <option value="alegria">Alegria</option>
          <option value="realizacao">Realização</option>
          <option value="orgulho">Orgulho</option>
        </select>
      </div>
      <div class="form-grupo">
        <label for="intensidade_musica">Intensidade (1 a 5):</label>
        <input type="number" id="intensidade_musica" min="1" max="5" value="3">
      </div>
      <button class="btn-cadastrar" onclick="cadastrarMusica()">Cadastrar Música</button>
    </section>

    <section class="card-admin">
      <h3>Cadastrar Top Referência (1 a 5)</h3>
      <input id="ref_nome" type="text" placeholder="Nome do artista ou grupo">
      <input id="ref_genero" type="text" placeholder="Gênero (ex: Rap Nacional, Boom Bap)">
      <input id="ref_origem" type="text" placeholder="Origem (ex: Zona Sul SP / Anos 90)">
      <textarea id="ref_impacto" placeholder="Por que é uma referência pessoal?"></textarea>
      <input id="ref_link" type="text" placeholder="Link (YouTube / Spotify)">
      <input id="ref_posicao" type="number" min="1" max="5" placeholder="Posição no Top (1 a 5)">

      <button class="botao" onclick="cadastrarReferencia()">Salvar Referência</button>
      
    </section>

  </main>

  <script>

    nome_admin.innerHTML = sessionStorage.NOME_USUARIO;

    function cadastrarPoesia() {
      let tituloPoesia = document.getElementById("titulo_poesia").value;
      let textoPoesia = document.getElementById("texto_poesia").value;
      let emocaoPoesia = document.getElementById("emocao_poesia").value;
      let intensidadePoesia = document.getElementById("intensidade_poesia").value;

      if (tituloPoesia == "" || textoPoesia == "" || emocaoPoesia == "") {
        alert("Por favor, preencha todos os campos da poesia!");
        return false;
      }

      fetch("/dashboard/cadastrar-poesia", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          titulo: tituloPoesia,
          texto: textoPoesia,
          emocao: emocaoPoesia,
          intensidade: intensidadePoesia,
          usuario_id: sessionStorage.getItem("ID_USUARIO")
        })
      }).then(function (resposta) {
        if (resposta.ok) {
          alert("Poesia cadastrada com sucesso!");
          location.reload();
        } else {
          alert("Erro ao cadastrar poesia!");
        }
      }).catch(function (error) {
        alert(error);
      });
    }

    function cadastrarMusica() {
      let tituloMusica = document.getElementById("titulo_musica").value;
      let artistaMusica = document.getElementById("artista_musica").value
      let linkMusica = document.getElementById("link_musica").value
      let emocaoMusica = document.getElementById("emocao_musica").value
      let intensidadeMusica = document.getElementById("intensidade_musica").value

      fetch("/dashboard/cadastrar-musica", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          titulo: tituloMusica,
          artista: artistaMusica,
          link: linkMusica,
          emocao: emocaoMusica,
          intensidade: intensidadeMusica,
          usuario_id: sessionStorage.getItem("ID_USUARIO")
        })
      }).then(function (resposta) {
        alert("Cadastrado com sucesso")
        location.reload();
      }).catch(function (error) {
        alert(error);
      })




    }

    function cadastrarReferencia() {
      var nomeVar = ref_nome.value;
      var generoVar = ref_genero.value;
      var origemVar = ref_origem.value;
      var impactoVar = ref_impacto.value;
      var linkVar = ref_link.value;
      var posicaoVar = ref_posicao.value;
      var idUsuarioVar = sessionStorage.ID_USUARIO;

      if (nomeVar == "" || generoVar == "" || impactoVar == "" || posicaoVar == "") {
        alert("Preencha nome, gênero, impacto e posição (1 a 5).");
        return;
      }

      fetch("/acervo/referencias", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          nomeServer: nomeVar,
          generoServer: generoVar,
          origemServer: origemVar,
          impactoServer: impactoVar,
          linkServer: linkVar,
          posicaoServer: posicaoVar,
          idUsuarioServer: idUsuarioVar
        })
      }).then(function (resposta) {
        if (resposta.ok) {
          alert("Referência cadastrada com sucesso!");
        } else {
          resposta.text().then(texto => alert("Erro: " + texto));
        }
      }).catch(function (erro) {
        console.error("Erro na requisição:", erro);
      });
    }








  </script>
</body>

</html>
