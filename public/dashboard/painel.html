<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel | Emoções</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/sessao.js"></script>
</head>

<body>
    <h1>Emoções nas poesias</h1>
    <canvas id="graficoEmocoes"></canvas>
    <canvas id="graficoMedia"></canvas>

  <script>
    fetch("/dashboard/emocoes-poesia")
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            var nomes = dados.map(function (item) {
                return item.nome;
            });
            var totais = dados.map(function (item) {
                return item.total;
            });
            var medias = dados.map(function (item) {
                return Number(item.media);
            });
            console.log(nomes, totais, medias);

            new Chart(document.getElementById("graficoEmocoes"), {
                type: "bar",
                data: {
                    labels: nomes,
                    datasets: [{
                        label: "Poesias por emoção",
                        data: totais
                    }]
                }
            });

            new Chart(document.getElementById("graficoMedia"), {
                type: "bar",
                data: {
                    labels: nomes,
                    datasets: [{
                        label: "Intensidade média",
                        data: medias
                    }]
                }
            });
        });
</script>

</body>

</html>
