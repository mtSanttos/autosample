<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel | Emoções</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/painel.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/sessao.js"></script>
</head>

<body>
    <main class="painel">
        <header class="painel-topo">
            <h1>Emoções nas poesias</h1>
            <p>Controle de emoções nas poesias</p>
        </header>

        <section class="painel-grade">
            <section class="indicadores">
                <article class="indicador">
                    <span class="indicador-rotulo">Emoção mais frequente</span>
                    <strong class="indicador-valor" id="indFrequente">—</strong>
                </article>
                <article class="indicador">
                    <span class="indicador-rotulo">Maior intensidade média</span>
                    <strong class="indicador-valor" id="indIntensa">—</strong>
                </article>
                <article class="indicador">
                    <span class="indicador-rotulo">Emoções com poesia</span>
                    <strong class="indicador-valor" id="indQuantidade">—</strong>
                </article>
            </section>
            <article class="cartao">
                <h2>Poesias por emoção</h2>
                <canvas id="graficoEmocoes"></canvas>
            </article>
            <article class="cartao">
                <h2>Intensidade média</h2>
                <canvas id="graficoMedia"></canvas>
            </article>
        </section>

        <section class="secao-poesias">
            <header class="secao-titulo">
                <h2>Listagem de Poesias</h2>
                <p>Versos e rimas cadastradas com suas emoções</p>
            </header>
            <div id="listaPoesias" class="grade-poesias">
                <!-- Cards renderizados dinamicamente via JS -->
            </div>
        </section>
    </main>

    <script>
        fetch("/dashboard/emocoes-poesia")
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (dados) {
                var nomes = dados.map(function (item) {
                    return item.nome;
                });
                var totais = dados.map(function (item) {
                    return item.total;
                });
                var medias = dados.map(function (item) {
                    return Number(item.media);
                });
                console.log(nomes, totais, medias);

                var nomeFrequente = "—";
                var maiorTotal = 0;
                var nomeIntensa = "—";
                var maiorMedia = 0;
                var comPoesia = 0;

                for (var i = 0; i < dados.length; i++) {
                    var total = Number(dados[i].total);
                    var media = Number(dados[i].media);

                    if (total > maiorTotal) {
                        maiorTotal = total;
                        nomeFrequente = dados[i].nome;
                    }
                    if (media > maiorMedia) {
                        maiorMedia = media;
                        nomeIntensa = dados[i].nome;
                    }
                    if (total > 0) {
                        comPoesia++;
                    }
                }

                document.getElementById("indFrequente").innerHTML = nomeFrequente;
                document.getElementById("indIntensa").innerHTML = nomeIntensa;
                document.getElementById("indQuantidade").innerHTML = comPoesia;

                new Chart(document.getElementById("graficoEmocoes"), {
                    type: "bar",
                    data: {
                        labels: nomes,
                        datasets: [{
                            label: "Poesias por emoção",
                            data: totais,
                            backgroundColor: "#b45309"
                        }]
                    },
                    options: {
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
                new Chart(document.getElementById("graficoMedia"), {
                    type: "bar",
                    data: {
                        labels: nomes,
                        datasets: [{
                            label: "Intensidade média",
                            data: medias,
                            backgroundColor: "#3b1d0f"
                        }]
                    },
                    options: {
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
            });

        function listarPoesias() {
            fetch("/dashboard/listar-poesias")
                .then(function (resposta) {
                    if (resposta.ok) {
                        return resposta.json();
                    } else {
                        throw new Error("Erro ao buscar poesias");
                    }
                })
                .then(function (poesias) {
                    var container = document.getElementById("listaPoesias");
                    container.innerHTML = "";

                    if (poesias.length == 0) {
                        container.innerHTML = "<p style='color: var(--creme); font-size: 1rem;'>Nenhuma poesia cadastrada ainda.</p>";
                        return;
                    }

                    for (var i = 0; i < poesias.length; i++) {
                        var p = poesias[i];
                        var emocaoFormatada = p.emocao;
                        if (emocaoFormatada == "realizacao") {
                            emocaoFormatada = "Realização";
                        } else if (emocaoFormatada) {
                            emocaoFormatada = emocaoFormatada.charAt(0).toUpperCase() + emocaoFormatada.slice(1);
                        } else {
                            emocaoFormatada = "Sem emoção";
                        }
                        var intensidadeTexto = p.intensidade ? ` (Nvl ${p.intensidade})` : "";
                        var autorTexto = p.autor ? p.autor : "Matheus";
                        var dataTexto = p.dtCriacaoFormatada ? p.dtCriacaoFormatada : "";

                        container.innerHTML += `
                            <article class="card-poesia">
                                <div class="poesia-cabecalho">
                                    <h3>${p.titulo}</h3>
                                    <span class="tag-emocao">${emocaoFormatada}${intensidadeTexto}</span>
                                </div>
                                <p class="poesia-texto">${p.texto}</p>
                                <div class="poesia-rodape">
                                    <span>Escrito por: <strong>${autorTexto}</strong></span>
                                    <span>${dataTexto}</span>
                                </div>
                            </article>
                        `;
                    }
                })
                .catch(function (erro) {
                    console.log("Erro ao carregar a listagem de poesias:", erro);
                });
        }

        listarPoesias();
    </script>

</body>

</html>
